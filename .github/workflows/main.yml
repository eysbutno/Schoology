name: Update Grades

on:
  workflow_dispatch:
  # schedule:
    # runs hourly from 8 AM to 9 PM PST
    # - cron: '0 15-23 * * *'
    # - cron: '0 0-4 * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # restore state.json from cache
      - name: Restore session state
        uses: actions/cache@v3
        with:
          path: state.json
          key: session-state-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            session-state-${{ runner.os }}-

      - name: Run scraper
        env:
          GOOGLE_USER: ${{ secrets.GOOGLE_USER }}
          GOOGLE_PASS: ${{ secrets.GOOGLE_PASS }}
        run: npx ts-node scrape.ts

      # save updated state.json to cache automatically
      - name: Save session state to cache
        uses: actions/cache@v3
        with:
          path: state.json
          key: session-state-${{ runner.os }}-${{ github.ref }}

      # commit any updates to grades, if any
      - name: Commit and push grades.json changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add grades.json
          git commit -m "Update grades"
          git push
